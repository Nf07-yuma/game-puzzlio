name: CI

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: 静的解析・テスト
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 依存パッケージ取得
        run: flutter pub get

      - name: フォーマットチェック
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静的解析 (flutter analyze)
        run: flutter analyze

      - name: テスト実行 (flutter test)
        run: flutter test

  build-apk:
    name: APKビルド
    needs: test
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Flutter セットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Java セットアップ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 依存パッケージ取得
        run: flutter pub get

      # リポジトリシークレットにアクセスできるpush/PRでのみ実行される
      # (fork からの PR はシークレットにアクセスできないため対象外)。
      # このステップが実行されない場合はAndroidのデバッグ署名鍵で
      # ビルドされるため、ワークフロー自体は成功する。
      - name: リリース署名の設定
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: リリースAPKビルド
        run: flutter build apk --release

      - name: APKアーティファクトのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: puzzlio-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
